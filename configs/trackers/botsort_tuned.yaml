# BoT-SORT réglé pour des véhicules (format Ultralytics).
# Ajoute la compensation du mouvement caméra (GMC) par rapport à ByteTrack.
tracker_type: botsort
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.40
track_buffer: 60
match_thresh: 0.80
fuse_score: True
gmc_method: sparseOptFlow   # caméra fixe -> on peut tester "none" pour gagner en vitesse
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False
model: auto
